<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Conect - NTEi IMÍDEO GIUSEPPE v2.0</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --prof: #00adef; --gestao: #f1c40f; --secre: #a55eea; --cad: #2ecc71; --ntei: #eb4d4b;
            --smeti: #C0C0C0;
            --hw-color: #e67e22; --sw-color: #3498db; --plat-color: #1dd1a1;
            --edm-yellow: #f4c521; --edm-green: #2ecc71; --edm-blue: #3498db; --edm-red: #e74c3c;
            --edm-grad: conic-gradient(from 0deg, var(--edm-yellow), var(--edm-green), var(--edm-blue), var(--edm-red), var(--edm-yellow));
            --bg-overlay: rgba(10, 11, 16, 0.92);
            --panel-bg: rgba(22, 27, 34, 0.75);
            --border-subtle: rgba(255,255,255,0.08);
            --text-muted: #8b949e;
            /* ══ novo sistema visual "foda" ══ */
            --sidebar-w: 268px;
            --glass-bg: linear-gradient(160deg, rgba(26,30,40,0.92), rgba(15,17,24,0.88));
            --glass-border: rgba(255,255,255,0.09);
            --accent-grad: linear-gradient(120deg, #00adef, #6a5cff);
            --glow-prof: 0 0 22px rgba(0,173,239,0.25);
            --card-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        *, *::before, *::after { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; font-family: 'Poppins', sans-serif; color: white; min-height: 100vh;
            background-image: linear-gradient(180deg,#0a4fa8 0%,#0b63c9 38%,#06377a 72%,#041d45 100%);
             /* wallpaper real vem do arquivo conect-wallpaper.css (ou do bloco final) */
             background-repeat: no-repeat;
             background-position: center center;
             background-attachment: fixed;
             background-size: 100% 100%;
             background-color: #ffffff;
             overflow-x: hidden;
        }
        /* ═══════════ SCROLLBAR ═══════════ */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,173,239,0.4); border-radius: 4px; }

        /* ═══════════ ALERT RIBBON ═══════════ */
        #alert-ribbon { background: var(--ntei); color: white; padding: 12px; text-align: center; font-weight: bold; display: none; position: fixed; top: 0; width: 100%; z-index: 10000; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
        /* ═══ Reserva espaço para o aviso geral, em vez de cobrir a navegação ═══ */
        :root { --aviso-altura: 0px; }
        #topbar { top: var(--aviso-altura) !important; }
        #notif-central { top: calc(56px + var(--aviso-altura)) !important; }
        #toast-container { top: calc(60px + var(--aviso-altura)) !important; }
        #main-system { padding-top: calc(68px + var(--aviso-altura)) !important; transition: padding-top 0.15s ease; }
        #topbar { transition: top 0.15s ease; }

        /* ═══════════ LOCK OVERLAY ═══════════ */
        #lock-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 999999; flex-direction: column; align-items: center; justify-content: center; }

        /* ═══════════ LOGIN ═══════════ */
        #login-screen {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;
            flex-wrap: wrap;
        }
        .login-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            flex-wrap: wrap;
            background: var(--bg-overlay);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 48px 16px 26px;
        }
        .slogan-container {
            width: 100%;
            text-align: center;
            padding: 0 0 20px 0;
        }
        .slogan-main { font-family: 'Orbitron'; font-size: 2.5rem; color: var(--prof); text-shadow: 0 0 15px rgba(0,173,239,0.6); margin-bottom: 5px; }
        .slogan-sub { font-weight: 300; letter-spacing: 2px; color: #ccc; font-style: italic; }
        .sector-column {
            flex: 1;
            min-width: 180px;
            max-width: 220px;
            display: flex !important;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 12px;
            transition: 0.4s;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            background: rgba(12, 17, 24, 0.7);
            box-shadow: 0 10px 24px rgba(0,0,0,0.18);
            opacity: 1 !important;
            visibility: visible !important;
            z-index: 2;
            position: relative;
        }
        .sector-column:hover {
            background: rgba(255,255,255,0.03);
            border-color: rgba(0,173,239,0.25);
            transform: translateY(-4px);
        }

        /* ═══════════ MAIN SYSTEM ═══════════ */
        #main-system { display: none; padding: 68px 16px 20px 16px; background: var(--bg-overlay); min-height: 100vh; gap: 16px; align-items: flex-start; }
        #main-system.flex-on { display: flex; }
        #main-content-col { flex: 1; min-width: 0; }

        /* ═══════════ SIDEBAR "FODA" ═══════════ */
        #app-sidebar {
            width: var(--sidebar-w); flex-shrink: 0; position: sticky; top: 68px;
            max-height: calc(100vh - 88px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
            padding-right: 2px;
        }
        .sb-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 14px; box-shadow: var(--card-shadow); }
        .sb-card h4 { margin: 0 0 10px 0; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; }
        .sb-unit-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .sb-unit-badge { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-grad); display: flex; align-items: center; justify-content: center; font-size: 17px; box-shadow: var(--glow-prof); }
        .sb-unit-name { font-weight: 700; font-size: 13px; line-height: 1.2; }
        .sb-unit-code { font-size: 10.5px; color: var(--text-muted); }
        .sb-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cad); display: inline-block; margin-right: 5px; box-shadow: 0 0 6px var(--cad); animation: pulse 2s infinite; }
        .sb-mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
        .sb-mini-stat { background: rgba(255,255,255,0.04); border-radius: 9px; padding: 8px; text-align: center; }
        .sb-mini-stat b { font-family: 'Orbitron'; font-size: 15px; display: block; }
        .sb-mini-stat span { font-size: 9.5px; color: var(--text-muted); }
        .sb-nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 9px; cursor: pointer; font-size: 11.5px; color: #d7dde5; transition: 0.2s; margin-bottom: 3px; border: 1px solid transparent; }
        .sb-nav-item:hover { background: rgba(0,173,239,0.1); border-color: rgba(0,173,239,0.15); }
        .sb-nav-item i.fa-circle { font-size: 6px; }
        .sb-quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .sb-quick-btn { background: rgba(255,255,255,0.045); border: 1px solid var(--glass-border); border-radius: 10px; padding: 10px 6px; text-align: center; cursor: pointer; transition: 0.2s; color: #fff; }
        .sb-quick-btn:hover { transform: translateY(-2px); border-color: rgba(0,173,239,0.35); box-shadow: var(--glow-prof); }
        .sb-quick-btn i { font-size: 15px; margin-bottom: 5px; display: block; }
        .sb-quick-btn span { font-size: 9.5px; color: var(--text-muted); }
        .sb-fav-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 11.5px; }
        .sb-fav-item:hover { background: rgba(255,255,255,0.05); }
        .sb-profile { display: flex; align-items: center; gap: 9px; }
        .sb-profile-name { font-size: 12px; font-weight: 600; }
        .sb-profile-role { font-size: 10px; color: var(--text-muted); }
        @media (max-width: 1100px) { #app-sidebar { display: none; } }

        /* rest of file unchanged... */
    </style>

    <script id="conect-fix-menus-v21-js">
        (function () {
            function ligar() {
                var nav = document.getElementById('topbar-nav');
                if (nav && !nav.classList.contains('topbar-nav')) nav.classList.add('topbar-nav');
                var btn = document.getElementById('mobile-menu-btn');
                if (btn && !btn.dataset.fixOk) {
                    btn.dataset.fixOk = '1';
                    btn.addEventListener('click', function (e) { e.stopPropagation(); });
                }
                var login = document.getElementById('login-screen');
                if (login) {
                    login.style.display = 'flex';
                    login.style.visibility = 'visible';
                    login.style.opacity = '1';
                }
                document.querySelectorAll('.sector-column').forEach(function (col) {
                    col.style.display = 'flex';
                    col.style.visibility = 'visible';
                    col.style.opacity = '1';
                });
                window.addEventListener('resize', function () {
                    if (window.innerWidth > 980 && nav) {
                        nav.classList.remove('mobile-open');
                        if (btn) { btn.classList.remove('active'); btn.innerHTML = '<i class="fa fa-bars"></i>'; }
                    }
                });
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ligar);
            else ligar();
        })();
    </script>

</head>
